[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "retry-amplification"
version = "0.1.0"
description = "A retry policy is a data corruption policy until the handler is idempotent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["psycopg[binary,pool]>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.4"]

[project.scripts]
retry-amplification = "retry_amplification.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 96
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: runs a full delivery sweep, tens of seconds"]
